start_quiz:
  name: Start quiz
  description: Start or resume today's shared question set for the logged-in user (fetches a set if none exists yet).
  target:
    device:
      integration: opentdb

new_quiz:
  name: New quiz
  description: Force-fetch a brand-new shared question set and start it.
  target:
    device:
      integration: opentdb

submit_answer:
  name: Submit answer
  description: Submit the logged-in user's one allowed answer for a question.
  target:
    device:
      integration: opentdb
  fields:
    question_index:
      name: Question index
      required: true
      selector:
        number:
          min: 0
          mode: box
    answer:
      name: Answer
      required: true
      selector:
        text:

next_question:
  name: Next question
  description: Advance after answer feedback.
  target:
    device:
      integration: opentdb

reset_quiz:
  name: Reset quiz
  description: Reset the logged-in user's progress without awarding completion.
  target:
    device:
      integration: opentdb

refresh:
  name: Refresh quiz
  description: Re-publish the current quiz state without replacing its question set.
  target:
    device:
      integration: opentdb

refresh_questions:
  name: Refresh quiz questions
  description: Deprecated alias of new_quiz. Force-fetch a brand-new shared question set and start it.
  target:
    device:
      integration: opentdb
